spring:
  application:
    name: pm-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pm}
    username: ${DB_USER:pm}
    password: ${DB_PASSWORD:pm}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
      base-path: /api
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-demo-secret-key-256bit!}
    expiry-minutes: 720
  rate-limit:
    default-per-minute: 120
    write-per-minute: 60
  outbox:
    poll-interval-ms: 200
  notifications:
    delivery-interval-ms: 2000
  board-cache:
    ttl-seconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  pattern:

    console: "%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
